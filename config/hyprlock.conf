# Tela de bloqueio do Uix (usada pelo botao "Bloquear" quando nao existe ~/.config/hypr/hyprlock.conf).
# ACCENT_RGB e trocado pela cor de destaque do Uix em scripts/lock.sh.

general {
    hide_cursor = true
}

# Print da tela, desfocado e escurecido
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    brightness = 0.55
}

# Hora
label {
    monitor =
    text = $TIME
    font_size = 110
    font_family = Adwaita Sans Bold
    color = rgba(ACCENT_RGB, 1.0)
    position = 0, 190
    halign = center
    valign = center
}

# Data
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d/%m"
    font_size = 22
    font_family = Adwaita Sans
    color = rgba(230, 233, 236, 0.85)
    position = 0, 90
    halign = center
    valign = center
}

# Usuario
label {
    monitor =
    text = $USER
    font_size = 16
    font_family = Adwaita Sans
    color = rgba(230, 233, 236, 0.7)
    position = 0, -10
    halign = center
    valign = center
}

# Campo de senha
input-field {
    monitor =
    size = 320, 56
    outline_thickness = 2
    rounding = -1
    dots_size = 0.25
    dots_spacing = 0.3
    outer_color = rgba(ACCENT_RGB, 0.9)
    inner_color = rgba(19, 22, 24, 0.85)
    font_color = rgba(230, 233, 236, 1.0)
    check_color = rgba(ACCENT_RGB, 1.0)
    fail_color = rgba(255, 123, 123, 1.0)
    fade_on_empty = false
    placeholder_text = Digite sua senha
    fail_text = Senha incorreta
    position = 0, -80
    halign = center
    valign = center
}
